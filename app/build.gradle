plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.lia.ingles'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lia.ingles'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        lia {
            storeFile file('lia.keystore')
            storePassword 'liaingles'
            keyAlias 'lia'
            keyPassword 'liaingles'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lia
        }
        debug {
            signingConfig signingConfigs.lia
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['js', 'css', 'html']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
